# Compiles the My Krisper iPhone app (app/) on a Mac so problems show up on the
# pull request, before anyone opens Xcode. Unsigned simulator build: no Apple
# account or secrets needed.
name: iOS app build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'crisper/index.html'
      - 'assets/sk-header.js'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    # App Store uploads must be built with Xcode 26+ and the iOS 26 SDK
    # (Apple, since April 28, 2026), so build with the same here.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Xcode version (must be 26 or later)
        run: |
          xcodebuild -version
          v=$(xcodebuild -version | awk 'NR==1{split($2,a,"."); print a[1]}')
          [ "$v" -ge 26 ] || { echo "::error::Xcode $v is too old for App Store uploads (need 26+)"; exit 1; }
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          exit ${PIPESTATUS[0]}
